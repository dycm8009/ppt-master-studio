name: Studio Regression

on:
  push:
    branches: [studio-dev, studio-main]
  pull_request:
    branches: [studio-main]
    paths:
      - 'studio/**'
      - '.github/workflows/studio-regression.yml'
      - '.github/workflows/studio-runtime-release.yml'
      - 'skills/ppt-master/**'

jobs:
  overlay-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile host adapter
        run: python -m py_compile studio/scripts/*.py studio/static_ui/*.py studio/tests/*.py
      - name: Load Static UI fallback adapter
        run: python studio/scripts/static_ui_adapter.py --help
      - name: Studio control-plane smoke tests
        run: python studio/tests/smoke_test.py
      - name: Stage 1 mini-app integration tests
        run: python studio/tests/stage1_mini_app_test.py
      - name: Runtime whitelist smoke
        shell: bash
        run: |
          set -euo pipefail
          ZIP=/tmp/ppt-master-studio-runtime-smoke.zip
          zip -qr "$ZIP" \
            skills/ppt-master \
            studio/VERSION.json \
            studio/host/chatgpt/ENTRYPOINT.md \
            studio/enforcement/PPT_MASTER_HOST_CAPABILITY_RULES.md \
            studio/scripts/enforced_bootstrap.py \
            studio/scripts/enforced_checkpoint.py \
            studio/scripts/enforced_preflight.py \
            studio/scripts/enforced_recovery.py \
            studio/scripts/mini_app_builder.py \
            studio/scripts/stage1_mini_app.py \
            studio/scripts/static_ui_adapter.py \
            studio/static_ui
          python - "$ZIP" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=set(z.namelist())
          assert 'skills/ppt-master/SKILL.md' in names
          assert 'studio/host/chatgpt/ENTRYPOINT.md' in names
          assert 'studio/enforcement/PPT_MASTER_HOST_CAPABILITY_RULES.md' in names
          assert 'studio/scripts/mini_app_builder.py' in names
          assert 'studio/scripts/stage1_mini_app.py' in names
          forbidden=('studio/artifact_ui_poc/','studio/regression/','studio/tests/','studio/PROJECT_BOOTSTRAP.md','studio/enforcement/PPT_MASTER_WORKFLOW.md')
          assert not any(any(n.startswith(prefix) for prefix in forbidden) for n in names)
          print(f'runtime whitelist: passed ({len(names)} entries)')
          PY
