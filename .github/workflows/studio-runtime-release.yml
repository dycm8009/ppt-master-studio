name: Studio Runtime Release

on:
  push:
    branches: [studio-main]

permissions:
  contents: write

jobs:
  publish-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build Unicode-safe commit-bound runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          ASSET="ppt-master-studio-runtime-${SHA}.zip"
          rm -f "$ASSET" "$ASSET.sha256"
          python studio/scripts/build_runtime_bundle.py \
            --repo-root . \
            --output "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"

          # The actual whitelist is centralized in build_runtime_bundle.py.
          # Key control paths remain named here for review and smoke contracts:
          # skills/ppt-master
          # studio/host/chatgpt/ENTRYPOINT.md
          # studio/enforcement/PPT_MASTER_HOST_CAPABILITY_RULES.md
          # studio/host/cloudflare/HOSTED_UI.json
          # studio/host/cloudflare/hosted_url.py
          # studio/host/cloudflare/hosted_confirm_handoff.py
          # studio/host/cloudflare/hosted_confirm_bridge.py
          # studio/host/cloudflare/hosted_editor_bridge.py
      - name: Upload connector-downloadable runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppt-master-studio-runtime
          path: |
            ppt-master-studio-runtime-${{ github.sha }}.zip
            ppt-master-studio-runtime-${{ github.sha }}.zip.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Create or update runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          TAG="studio-runtime-${SHA}"
          ASSET="ppt-master-studio-runtime-${SHA}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
              --target "$SHA" \
              --title "PPT Master Studio Runtime ${SHA}" \
              --notes "Commit-bound minimal ChatGPT host runtime for PPT Master Studio. PPT workflow authority remains skills/ppt-master at commit ${SHA}; Cloudflare is only a Hosted official-UI transport and this ZIP is not a project Recovery Bundle."
          fi
