name: Studio Regression

on:
  push:
    branches: [studio-dev, studio-main]
  pull_request:
    branches: [studio-main]
    paths:
      - 'studio/**'
      - '.github/workflows/studio-regression.yml'
      - 'skills/ppt-master/**'

jobs:
  overlay-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile Studio scripts
        run: python -m py_compile studio/scripts/*.py studio/static_ui/*.py studio/tests/*.py studio/hosted_ui_poc/validate_stage1_gate.py
      - name: Load Static UI Adapter
        run: python studio/scripts/static_ui_adapter.py --help
      - name: Studio smoke tests
        run: python studio/tests/smoke_test.py
      - name: Install Hosted UI POC dependencies
        working-directory: studio/hosted_ui_poc
        run: npm install --no-audit --no-fund
      - name: Hosted UI POC transport smoke
        run: node studio/hosted_ui_poc/test_hosted_ui.mjs
      - name: Hosted UI POC MCP bundle dry-run
        working-directory: studio/hosted_ui_poc
        run: npx wrangler deploy --dry-run
