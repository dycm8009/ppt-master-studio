<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPT Master Hosted Confirm POC</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0f172a;color:#e2e8f0}.wrap{max-width:1100px;margin:0 auto;padding:28px}.card{background:#111827;border:1px solid #334155;border-radius:16px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;color:#94a3b8;display:block;margin-bottom:6px}input,textarea{width:100%;box-sizing:border-box;background:#0b1220;color:#e2e8f0;border:1px solid #475569;border-radius:10px;padding:10px}textarea{min-height:90px}.btn{background:#2563eb;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.muted{color:#94a3b8;font-size:13px}.ok{color:#86efac}.err{color:#fca5a5}.pill{display:inline-block;border:1px solid #475569;border-radius:999px;padding:6px 10px;color:#cbd5e1}pre{white-space:pre-wrap;word-break:break-word;background:#020617;padding:14px;border-radius:10px;max-height:320px;overflow:auto}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>PPT Master Hosted Confirm</h1><div class="muted">POC B2：Hosted UI 只捕获选择，不自行授予 Harness accepted 状态。</div><div id="status" class="card">正在加载 session…</div><div id="app"></div></div><script>
const statusEl=document.getElementById('status'), app=document.getElementById('app');
const token=location.pathname.split('/').filter(Boolean).pop(); let session;
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function api(path,opts={}){const r=await fetch(path,{headers:{'content-type':'application/json'},...opts});const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
function field(id,label,val){return `<div><label for="${id}">${label}</label><textarea id="${id}">${esc(val)}</textarea></div>`}
function renderStage1(s){const p=s.payload||{}, rec=p.recommendation||{};const keys=['audience','communication_intent','audience_outcome','core_message','delivery_context','artifact_afterlife','content_divergence'];const labels={audience:'受众',communication_intent:'沟通意图',audience_outcome:'期望受众结果',core_message:'核心信息',delivery_context:'使用场景',artifact_afterlife:'材料后续用途',content_divergence:'内容处理'};app.innerHTML=`<div class="card"><h2>Stage 1</h2><div class="grid">${keys.map(k=>field(k,labels[k],rec[k]||'')).join('')}</div><div class="grid"><div><label>主要语言</label><input id="primary_language" value="${esc(rec.primary_language||'zh-CN')}"></div><div><label>画布</label><input id="canvas" value="${esc((rec.recommend||{}).canvas||rec.canvas||'ppt169')}"></div></div><h3>模板</h3><span class="pill">POC：自由设计</span><div class="muted">B2 transport POC 暂不开放模板选择；完整 candidate schema 在 transport 验证通过后迁移。</div><p><button class="btn" id="submit">确认并捕获</button></p><pre id="out"></pre></div>`;document.getElementById('submit').onclick=async()=>{const btn=document.getElementById('submit');btn.disabled=true;const values={stage:'stage1',primary_language:document.getElementById('primary_language').value,canvas:document.getElementById('canvas').value,template_selection:{mode:'free_design',selection_keys:[]}};for(const k of keys)values[k]=document.getElementById(k).value;const response={schema:'ppt-master-chat-confirm/v1',surface:'stage1',status:'user-confirmed',recommendation_sha256:p.recommendation_sha256,options_sha256:p.options_sha256,values};try{const ack=await api(`/api/sessions/${token}/response`,{method:'POST',body:JSON.stringify(response)});document.getElementById('out').textContent=JSON.stringify({ack,response},null,2);statusEl.innerHTML='<span class="ok">已捕获；仍需返回 Harness validate。</span>'}catch(e){btn.disabled=false;statusEl.innerHTML=`<span class="err">${esc(e.message)}</span>`}}}
function renderGeneric(s){app.innerHTML=`<div class="card"><h2>${esc(s.surface)}</h2><p class="muted">此 POC 当前仅实现 Stage 1 表单；其余 surface 先验证 session 传输层。</p><pre>${esc(JSON.stringify(s.payload,null,2))}</pre></div>`}
(async()=>{try{session=await api(`/api/sessions/${token}`);statusEl.textContent=`Session ${token.slice(0,10)}… · ${session.surface} · 到期 ${session.expires_at}`;session.surface==='stage1'?renderStage1(session):renderGeneric(session)}catch(e){statusEl.innerHTML=`<span class="err">${esc(e.message)}</span>`}})();
</script></body></html>
