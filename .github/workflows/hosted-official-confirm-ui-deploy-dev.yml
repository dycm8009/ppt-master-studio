name: Hosted Official Confirm UI Deploy Dev

on:
  push:
    branches: [feat/cloudflare-official-confirm-ui]
    paths:
      - 'studio/host/cloudflare/**'
      - 'skills/ppt-master/scripts/confirm_ui/**'
      - 'skills/ppt-master/templates/icons/**'
      - 'skills/ppt-master/references/ai-image-comparison/**'
      - '.github/workflows/hosted-official-confirm-ui-deploy-dev.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare deployment credentials
        id: cf
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare dev deploy skipped: repository secrets are not configured."
          fi
      - name: Install dependencies
        if: steps.cf.outputs.ready == 'true'
        working-directory: studio/host/cloudflare
        run: npm install --no-audit --no-fund
      - name: Build pinned official Confirm UI assets
        if: steps.cf.outputs.ready == 'true'
        working-directory: studio/host/cloudflare
        run: npm run build
      - name: Run hosted tests before deploy
        if: steps.cf.outputs.ready == 'true'
        working-directory: studio/host/cloudflare
        run: npm run test:contract && node test_hosted_official.mjs
      - name: Deploy isolated dev Worker
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: studio/host/cloudflare
          wranglerVersion: '4.115.0'
          command: deploy
