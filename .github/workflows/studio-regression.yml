name: Studio Regression

on:
  push:
    branches: [studio-dev, studio-main]
  pull_request:
    branches: [studio-main]
    paths:
      - 'studio/**'
      - '.github/workflows/studio-regression.yml'
      - 'skills/ppt-master/**'

jobs:
  overlay-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Studio scripts
        run: python -m py_compile studio/scripts/*.py studio/static_ui/*.py studio/tests/*.py
      - name: Compile chat-inline artifact adapter
        run: python -m compileall studio/artifact_ui_poc
      - name: Load Static UI Adapter
        run: python studio/scripts/static_ui_adapter.py --help
      - name: Studio smoke tests
        run: python studio/tests/smoke_test.py
      - name: Chat-inline artifact authority and parity tests
        run: |
          python -m studio.artifact_ui_poc.test_contract
          python -m studio.artifact_ui_poc.test_handoff
          python -m studio.artifact_ui_poc.test_adapter
          python -m studio.artifact_ui_poc.test_project_models
          python -m studio.artifact_ui_poc.test_renderer
          python -m studio.artifact_ui_poc.test_stage2_parity
          python -m studio.artifact_ui_poc.test_motion_parity
          python -m studio.artifact_ui_poc.test_package
          python -m studio.artifact_ui_poc.test_render_contract
