name: Studio Runtime Release

on:
  push:
    branches: [studio-main]

permissions:
  contents: write

jobs:
  publish-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build commit-bound runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          ASSET="ppt-master-studio-runtime-${SHA}.zip"
          rm -f "$ASSET" "$ASSET.sha256"
          zip -qr "$ASSET" \
            skills/ppt-master \
            studio/VERSION.json \
            studio/host/chatgpt/ENTRYPOINT.md \
            studio/enforcement/PPT_MASTER_HOST_CAPABILITY_RULES.md \
            studio/scripts/enforced_bootstrap.py \
            studio/scripts/enforced_checkpoint.py \
            studio/scripts/enforced_preflight.py \
            studio/scripts/enforced_recovery.py \
            studio/scripts/mini_app_builder.py \
            studio/scripts/stage1_mini_app.py \
            studio/scripts/static_ui_adapter.py \
            studio/static_ui
          sha256sum "$ASSET" > "$ASSET.sha256"
      - name: Upload connector-downloadable runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppt-master-studio-runtime
          path: |
            ppt-master-studio-runtime-${{ github.sha }}.zip
            ppt-master-studio-runtime-${{ github.sha }}.zip.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Create or update runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          TAG="studio-runtime-${SHA}"
          ASSET="ppt-master-studio-runtime-${SHA}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
              --target "$SHA" \
              --title "PPT Master Studio Runtime ${SHA}" \
              --notes "Commit-bound minimal ChatGPT host runtime for PPT Master Studio. PPT workflow authority remains skills/ppt-master at commit ${SHA}; this ZIP is not a project Recovery Bundle."
          fi
