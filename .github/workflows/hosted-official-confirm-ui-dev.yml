name: Hosted Official UI Dev

on:
  push:
    branches: [feat/cloudflare-official-confirm-ui]
    paths:
      - 'studio/host/cloudflare/**'
      - 'skills/ppt-master/scripts/confirm_ui/**'
      - 'skills/ppt-master/scripts/svg_editor/**'
      - 'skills/ppt-master/templates/icons/**'
      - 'skills/ppt-master/references/ai-image-comparison/**'
      - '.github/workflows/hosted-official-confirm-ui-dev.yml'

jobs:
  hosted-official-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Cloudflare dependencies
        working-directory: studio/host/cloudflare
        run: npm install --no-audit --no-fund
      - name: Build pinned official UI assets
        working-directory: studio/host/cloudflare
        run: npm run build
      - name: Check official frontend/API drift
        working-directory: studio/host/cloudflare
        run: npm run test:contract
      - name: Test compact browser handoff
        working-directory: studio/host/cloudflare
        run: python test_confirm_handoff.py
      - name: Test hosted Stage 1 -> Stage 2 lifecycle
        working-directory: studio/host/cloudflare
        run: node test_hosted_official.mjs
      - name: Test hosted official SVG Editor lifecycle
        working-directory: studio/host/cloudflare
        run: node test_hosted_editor.mjs
      - name: Compile Runtime bridge helpers
        working-directory: studio/host/cloudflare
        run: python -m py_compile hosted_confirm_handoff.py hosted_editor_bridge.py test_runtime_roundtrip.py
      - name: Wrangler dev bundle dry-run
        working-directory: studio/host/cloudflare
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Wrangler production bundle dry-run
        working-directory: studio/host/cloudflare
        run: npx wrangler deploy --dry-run --config wrangler.prod.jsonc
