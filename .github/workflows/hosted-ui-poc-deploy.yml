name: Hosted UI POC Deploy

on:
  workflow_dispatch:
  push:
    branches: [studio-dev]
    paths:
      - 'studio/hosted_ui_poc/**'
      - '.github/workflows/hosted-ui-poc-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Cloudflare deployment credentials
        id: cf
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Hosted UI POC deploy skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          fi
      - name: Install Hosted UI POC dependencies
        if: steps.cf.outputs.ready == 'true'
        working-directory: studio/hosted_ui_poc
        run: npm install --no-audit --no-fund
      - name: Deploy Hosted UI POC to Cloudflare
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: studio/hosted_ui_poc
          wranglerVersion: '4.115.0'
          command: deploy
