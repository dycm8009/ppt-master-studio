name: Studio Regression

on:
  push:
    branches: [studio-dev, studio-main]
  pull_request:
    branches: [studio-main]
    paths:
      - 'studio/**'
      - '.github/workflows/studio-regression.yml'
      - '.github/workflows/studio-runtime-release.yml'
      - '.github/workflows/hosted-official-ui-deploy-prod.yml'
      - 'skills/ppt-master/**'

jobs:
  overlay-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile Studio host adapters
        run: |
          python -m py_compile \
            studio/scripts/build_runtime_bundle.py \
            studio/scripts/enforced_bootstrap.py \
            studio/scripts/enforced_checkpoint.py \
            studio/scripts/enforced_preflight.py \
            studio/scripts/enforced_recovery.py \
            studio/host/cloudflare/hosted_url.py \
            studio/host/cloudflare/hosted_confirm_handoff.py \
            studio/host/cloudflare/hosted_confirm_bridge.py \
            studio/host/cloudflare/hosted_editor_bridge.py \
            studio/tests/runtime_bundle_headless_test.py \
            studio/tests/smoke_test.py

      - name: Studio control-plane smoke tests
        run: python studio/tests/smoke_test.py

      - name: Validate extracted Runtime without Flask
        run: python studio/tests/runtime_bundle_headless_test.py

      - name: Install Hosted UI test dependencies
        run: |
          python -m pip install 'flask>=3.0.0'
          cd studio/host/cloudflare
          npm install --no-audit --no-fund

      - name: Validate official Hosted UI contracts
        working-directory: studio/host/cloudflare
        run: |
          npm run build
          npm run test:contract
          node test_hosted_official.mjs
          node test_hosted_editor.mjs
          python test_confirm_handoff.py
          python test_confirm_authority.py

      - name: Wrangler production bundle dry-run
        working-directory: studio/host/cloudflare
        run: npx wrangler deploy --dry-run --config wrangler.prod.jsonc

      - name: Runtime whitelist smoke
        shell: bash
        run: |
          set -euo pipefail
          ZIP=/tmp/ppt-master-studio-runtime-smoke.zip
          python studio/scripts/build_runtime_bundle.py \
            --repo-root . \
            --output "$ZIP"
          python - "$ZIP" <<'PY'
          import re, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names=set(z.namelist())
              unicode_info=z.getinfo('skills/ppt-master/templates/brands/中国电信/templates/design_spec.md')
          required={
              'skills/ppt-master/SKILL.md',
              'studio/host/chatgpt/ENTRYPOINT.md',
              'studio/enforcement/PPT_MASTER_HOST_CAPABILITY_RULES.md',
              'studio/host/cloudflare/HOSTED_UI.json',
              'studio/host/cloudflare/hosted_url.py',
              'studio/host/cloudflare/hosted_confirm_handoff.py',
              'studio/host/cloudflare/hosted_confirm_bridge.py',
              'studio/host/cloudflare/hosted_editor_bridge.py',
          }
          assert required <= names
          assert unicode_info.flag_bits & 0x800
          assert not any(re.search(r'#U[0-9A-Fa-f]{4}', name) for name in names)
          forbidden=(
              'studio/artifact_ui_poc/',
              'studio/regression/',
              'studio/tests/',
              'studio/static_ui/',
              'studio/scripts/mini_app_builder.py',
              'studio/scripts/stage1_mini_app.py',
              'studio/scripts/static_ui_adapter.py',
              'studio/host/cloudflare/worker.js',
              'studio/host/cloudflare/worker_production.js',
              'studio/host/cloudflare/test_',
              'studio/PROJECT_BOOTSTRAP.md',
              'studio/enforcement/PPT_MASTER_WORKFLOW.md',
          )
          assert not any(any(n.startswith(prefix) for prefix in forbidden) for n in names)
          print(f'runtime whitelist + Unicode paths: passed ({len(names)} entries)')
          PY
